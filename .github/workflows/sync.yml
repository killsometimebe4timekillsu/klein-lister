# Reusable workflow: call it from your private data repo, see examples/caller-workflow.yml.
name: Sync listings

on:
  workflow_call:
    inputs:
      mode:
        description: "sync, extend or import"
        type: string
        default: sync
      before:
        description: "commit to diff against (the push event's 'before')"
        type: string
        default: ""
      tool-ref:
        description: "ref of klein-lister to run; keep it equal to the @ref you call this workflow with"
        type: string
        default: v1
      tool-repository:
        type: string
        default: killsometimebe4timekillsu/klein-lister
      runs-on:
        description: "runner labels as JSON"
        type: string
        default: '["self-hosted", "kleinanzeigen"]'
    secrets:
      KLEINANZEIGEN_USERNAME:
        required: true
      KLEINANZEIGEN_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  sync:
    # Kleinanzeigen tends to challenge logins from GitHub-hosted (datacenter) IPs,
    # so this expects a self-hosted runner with a residential IP and Chromium.
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    steps:
      # Without git, actions/checkout silently falls back to a tarball and the
      # diff and commit-back steps break, so fail early with a clear message.
      - name: Check runner prerequisites
        run: |
          missing=()
          for tool in git python3 curl; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          command -v chromium || command -v chromium-browser || command -v google-chrome || command -v microsoft-edge \
            || missing+=("chromium or google-chrome")
          if (( ${#missing[@]} )); then
            echo "::error::Missing on the runner (install, then restart the runner service): ${missing[*]}"
            exit 1
          fi

      - name: Check out data repo
        uses: actions/checkout@v4
        with:
          path: data
          fetch-depth: 0

      - name: Check out klein-lister
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool-repository }}
          ref: ${{ inputs.tool-ref }}
          path: tool

      - name: Install kleinanzeigen-bot
        run: bash tool/scripts/install-bot.sh

      - name: Sync
        working-directory: data
        env:
          KLEINANZEIGEN_BOT_USERNAME: ${{ secrets.KLEINANZEIGEN_USERNAME }}
          KLEINANZEIGEN_BOT_PASSWORD: ${{ secrets.KLEINANZEIGEN_PASSWORD }}
          MODE: ${{ inputs.mode }}
          BEFORE: ${{ inputs.before }}
        run: python3 ../tool/scripts/sync.py --mode "$MODE" --before "$BEFORE"

      - name: Commit listing ids back
        if: always()
        working-directory: data
        env:
          MODE: ${{ inputs.mode }}
        run: |
          git add listings imported-inactive 2>/dev/null || git add listings
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git -c user.name="klein-lister[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: update listing state (${MODE}) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
